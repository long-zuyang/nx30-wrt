name: Build ImmortalWrt 24.10 for NX30 Pro 112M NMBM

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "ImmortalWrt 源码分支"
        required: true
        default: "openwrt-24.10"

      openclash_version:
        description: "OpenClash 版本"
        required: true
        default: "v0.47.156"

      mihomo_version:
        description: "Mihomo 版本"
        required: true
        default: "v1.19.31"

permissions:
  contents: read

concurrency:
  group: nx30pro-112m-build
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

  SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git

  TARGET: mediatek
  SUBTARGET: filogic

  # 注意：
  # 112M 大分区第三方 U-Boot 一般使用 NMBM
  DEVICE: h3c_magic-nx30-pro-nmbm

  # 112 MiB = 114688 KiB = 0x07000000
  UBI_SIZE_KIB: "114688"
  UBI_SIZE_HEX: "0x7000000"

jobs:
  build:
    name: Build NX30 Pro 112M Firmware

    runs-on: ubuntu-22.04

    timeout-minutes: 360

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: 检出当前仓库
        uses: actions/checkout@v4

      # ============================================================
      # 清理 GitHub Runner
      # ============================================================

      - name: 释放磁盘空间
        run: |
          set -eux

          echo "清理前："
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true

          sudo docker image prune -af || true

          echo "清理后："
          df -h

      # ============================================================
      # 编译依赖
      # ============================================================

      - name: 安装编译依赖
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            zstd \
            device-tree-compiler \
            ccache

      # ============================================================
      # ImmortalWrt
      # ============================================================

      - name: 获取 ImmortalWrt 源码
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${SOURCE_BRANCH}" \
            "${SOURCE_REPO}" \
            immortalwrt

          cd immortalwrt

          echo "================================================"
          echo "ImmortalWrt Source"
          echo "================================================"

          git log -1 --oneline

          git rev-parse HEAD > ../immortalwrt_commit.txt

      # ============================================================
      # DL Cache
      # ============================================================

      - name: 缓存源码下载目录
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-24.10-dl-${{ runner.os }}-${{ inputs.source_branch }}
          restore-keys: |
            immortalwrt-24.10-dl-${{ runner.os }}-

      # ============================================================
      # Feeds
      # ============================================================

      - name: 更新 Feeds
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============================================================
      # OpenClash
      # ============================================================

      - name: 添加 OpenClash 源码
        env:
          OPENCLASH_VERSION: ${{ inputs.openclash_version }}
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          rm -rf package/luci-app-openclash

          git clone \
            --depth 1 \
            --branch "${OPENCLASH_VERSION}" \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

          if [ ! -f package/luci-app-openclash/luci-app-openclash/Makefile ]; then
            echo "OpenClash Makefile 不存在"
            exit 1
          fi

          echo "OpenClash:"
          grep "PKG_VERSION" \
            package/luci-app-openclash/luci-app-openclash/Makefile \
            | head

      # ============================================================
      # 112M NMBM Patch
      # ============================================================

      - name: 修改 NX30 Pro 为 112M NMBM 大分区
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          DTS="target/linux/mediatek/dts/mt7981b-h3c-magic-nx30-pro-nmbm.dts"

          MK="target/linux/mediatek/image/filogic.mk"

          # --------------------------------------------------------
          # 修改 NMBM DTS
          #
          # 原布局：
          #
          # BL2          1M
          # u-boot-env   512K
          # Factory      2M
          # FIP          2M
          # ubi          64M
          # pdt_data
          # pdt_data_1
          # exp
          # plugin
          #
          # 112M U-Boot：
          #
          # BL2          1M
          # u-boot-env   512K
          # Factory      2M
          # FIP          2M
          # ubi          112M
          #
          # UBI:
          #
          # start = 0x0580000
          # size  = 0x7000000
          # --------------------------------------------------------

          cat >> "${DTS}" << 'EOF'


          /*
           * H3C Magic NX30 Pro
           * 112 MiB NMBM UBI layout
           *
           * UBI start: 0x0580000
           * UBI size : 0x7000000 (112 MiB)
           */

          &ubi {
                  reg = <0x0580000 0x7000000>;
          };

          &spi_nand {
                  partitions {
                          /delete-node/ partition@4580000;
                          /delete-node/ partition@4b80000;
                          /delete-node/ partition@5180000;
                          /delete-node/ partition@5280000;
                  };
          };
          EOF

          # --------------------------------------------------------
          # 修改 IMAGE_SIZE
          #
          # 65536k
          # ↓
          # 114688k
          # --------------------------------------------------------

          sed -i \
            '/define Device\/h3c_magic-nx30-pro-nmbm/,/endef/ s/IMAGE_SIZE := 65536k/IMAGE_SIZE := 114688k/' \
            "${MK}"

          sed -i \
            '/define Device\/h3c_magic-nx30-pro-nmbm/,/endef/ s/DEVICE_VARIANT := (NMBM layout)/DEVICE_VARIANT := (NMBM 112M layout)/' \
            "${MK}"

          echo
          echo "================================================"
          echo "检查 Device Profile"
          echo "================================================"

          sed -n \
            '/define Device\/h3c_magic-nx30-pro-nmbm/,/endef/p' \
            "${MK}"

          echo
          echo "================================================"
          echo "检查 DTS 112M Patch"
          echo "================================================"

          tail -n 35 "${DTS}"

          # 必须确认 IMAGE_SIZE 修改成功

          sed -n \
            '/define Device\/h3c_magic-nx30-pro-nmbm/,/endef/p' \
            "${MK}" \
            | grep -q "IMAGE_SIZE := 114688k"

          # 必须确认 DTS 修改成功

          grep -q \
            'reg = <0x0580000 0x7000000>' \
            "${DTS}"

      # ============================================================
      # Mihomo Core
      # ============================================================

      - name: 下载 Mihomo ARM64 Core
        env:
          MIHOMO_VERSION: ${{ inputs.mihomo_version }}
          GH_TOKEN: ${{ github.token }}
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          mkdir -p files/etc/openclash/core

          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}"

          ASSET_NAME="mihomo-linux-arm64-${MIHOMO_VERSION}.gz"

          echo "查找 Mihomo:"
          echo "${ASSET_NAME}"

          curl \
            -fsSL \
            --retry 3 \
            --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}" \
            -o /tmp/mihomo-release.json

          MIHOMO_URL=$(
            jq -er \
              --arg NAME "${ASSET_NAME}" \
              '.assets[]
               | select(.name == $NAME)
               | .browser_download_url' \
              /tmp/mihomo-release.json \
              | head -n 1
          )

          if [ -z "${MIHOMO_URL}" ]; then
            echo "找不到 Mihomo ARM64:"
            echo "${ASSET_NAME}"
            exit 1
          fi

          echo "Mihomo URL:"
          echo "${MIHOMO_URL}"

          curl \
            -fL \
            --retry 3 \
            --retry-delay 3 \
            "${MIHOMO_URL}" \
            -o /tmp/mihomo.gz

          gzip -t /tmp/mihomo.gz

          gzip -dc /tmp/mihomo.gz \
            > files/etc/openclash/core/clash_meta

          chmod 0755 \
            files/etc/openclash/core/clash_meta

          echo
          echo "================================================"
          echo "检查 Mihomo 架构"
          echo "================================================"

          file \
            files/etc/openclash/core/clash_meta

          file \
            files/etc/openclash/core/clash_meta \
            | grep -Eq 'ARM aarch64|ARM64'

      # ============================================================
      # OpenWrt Config
      # ============================================================

      - name: 生成编译配置
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          cat > .config << 'EOF'

          #
          # Target
          #

          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm=y


          #
          # LuCI
          #

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y

          CONFIG_PACKAGE_luci-theme-argon=y

          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y


          #
          # OpenClash
          #

          CONFIG_PACKAGE_luci-app-openclash=y


          #
          # DNS
          #
          # OpenClash nftables 使用 dnsmasq-full
          #

          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y


          #
          # OpenClash dependencies
          #

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y

          CONFIG_PACKAGE_ip-full=y

          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_PACKAGE_unzip=y


          #
          # 256MB RAM 优化
          #

          CONFIG_PACKAGE_zram-swap=y


          #
          # Build
          #

          CONFIG_CCACHE=y

          EOF

          make defconfig

          echo
          echo "================================================"
          echo "最终 Target"
          echo "================================================"

          grep '^CONFIG_TARGET_' .config

          echo
          echo "================================================"
          echo "OpenClash"
          echo "================================================"

          grep 'CONFIG_PACKAGE_luci-app-openclash' .config

          echo
          echo "================================================"
          echo "DNSMasq"
          echo "================================================"

          grep 'dnsmasq' .config || true

          cp .config ../build.config

      # ============================================================
      # 下载源码
      # ============================================================

      - name: 下载编译依赖源码
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          make download -j8

      # ============================================================
      # Build
      # ============================================================

      - name: 编译 ImmortalWrt
        working-directory: immortalwrt
        run: |
          set -o pipefail

          echo "CPU:"
          nproc

          echo
          echo "Disk:"
          df -h

          echo
          echo "开始编译..."

          make -j"$(nproc)" V=s || {
            echo
            echo "================================================"
            echo "并行编译失败，使用单线程输出详细错误"
            echo "================================================"

            make -j1 V=s
          }

      # ============================================================
      # 验证最终 DTB
      # ============================================================

      - name: 验证最终固件确实为 112M NMBM
        working-directory: immortalwrt
        run: |
          set -euxo pipefail

          DTB=$(
            find build_dir \
              -type f \
              -name '*h3c-magic-nx30-pro-nmbm*.dtb' \
              | head -n 1
          )

          if [ -z "${DTB}" ]; then
            echo "找不到 NX30 Pro NMBM DTB"
            exit 1
          fi

          echo "找到 DTB:"
          echo "${DTB}"

          dtc \
            -I dtb \
            -O dts \
            "${DTB}" \
            > /tmp/nx30pro-final.dts 2>/dev/null

          echo
          echo "================================================"
          echo "检查 NMBM"
          echo "================================================"

          grep -n \
            'mediatek,nmbm' \
            /tmp/nx30pro-final.dts

          echo
          echo "================================================"
          echo "检查 112M UBI"
          echo "================================================"

          grep -n -A10 \
            'partition@580000' \
            /tmp/nx30pro-final.dts

          # 必须为 112M

          if ! grep -Eq \
            'reg = <0x0*580000 0x0*7000000>' \
            /tmp/nx30pro-final.dts; then

            echo "错误：最终 DTB 不是 112M UBI"
            exit 1

          fi

          # 这些原厂分区在 112M layout 下不能继续存在

          for PART in \
            partition@4580000 \
            partition@4b80000 \
            partition@5180000 \
            partition@5280000
          do

            if grep -q "${PART}" /tmp/nx30pro-final.dts; then
              echo "错误：发现残留分区 ${PART}"
              exit 1
            fi

          done

          echo
          echo "=============================================="
          echo "112M NMBM DTB 验证成功"
          echo "=============================================="

      # ============================================================
      # 整理 Firmware
      # ============================================================

      - name: 整理固件
        env:
          OPENCLASH_VERSION: ${{ inputs.openclash_version }}
          MIHOMO_VERSION: ${{ inputs.mihomo_version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euxo pipefail

          OUT="immortalwrt/bin/targets/mediatek/filogic"

          RELEASE="release_firmware"

          mkdir -p "${RELEASE}"

          echo
          echo "================================================"
          echo "全部编译产物"
          echo "================================================"

          ls -lah "${OUT}"

          SYSUPGRADE=$(
            find "${OUT}" \
              -maxdepth 1 \
              -type f \
              -name '*h3c_magic-nx30-pro-nmbm*squashfs-sysupgrade.bin' \
              | head -n 1
          )

          FACTORY=$(
            find "${OUT}" \
              -maxdepth 1 \
              -type f \
              -name '*h3c_magic-nx30-pro-nmbm*squashfs-factory.bin' \
              | head -n 1
          )

          INITRAMFS=$(
            find "${OUT}" \
              -maxdepth 1 \
              -type f \
              -name '*h3c_magic-nx30-pro-nmbm*initramfs*.bin' \
              | head -n 1 || true
          )

          if [ -z "${SYSUPGRADE}" ]; then
            echo "没有找到 sysupgrade.bin"
            exit 1
          fi

          if [ -z "${FACTORY}" ]; then
            echo "没有找到 factory.bin"
            exit 1
          fi

          SYS_NAME=$(
            basename "${SYSUPGRADE}" \
              | sed \
                's/h3c_magic-nx30-pro-nmbm/h3c_magic-nx30-pro-nmbm-112m/'
          )

          FACTORY_NAME=$(
            basename "${FACTORY}" \
              | sed \
                's/h3c_magic-nx30-pro-nmbm/h3c_magic-nx30-pro-nmbm-112m/'
          )

          cp \
            "${SYSUPGRADE}" \
            "${RELEASE}/${SYS_NAME}"

          cp \
            "${FACTORY}" \
            "${RELEASE}/${FACTORY_NAME}"

          if [ -n "${INITRAMFS}" ]; then

            INIT_NAME=$(
              basename "${INITRAMFS}" \
                | sed \
                  's/h3c_magic-nx30-pro-nmbm/h3c_magic-nx30-pro-nmbm-112m/'
            )

            cp \
              "${INITRAMFS}" \
              "${RELEASE}/${INIT_NAME}"

          fi

          cp \
            build.config \
            "${RELEASE}/build.config"

          COMMIT=$(cat immortalwrt_commit.txt)

          cat > "${RELEASE}/BUILD_INFO.txt" << EOF
          Device:
            H3C Magic NX30 Pro

          Layout:
            NMBM 112M

          UBI:
            Start: 0x0580000
            Size:  0x7000000
            Size:  114688 KiB
            Size:  112 MiB

          Target:
            mediatek/filogic

          Device Profile:
            h3c_magic-nx30-pro-nmbm

          ImmortalWrt Branch:
            ${SOURCE_BRANCH}

          ImmortalWrt Commit:
            ${COMMIT}

          OpenClash:
            ${OPENCLASH_VERSION}

          Mihomo:
            ${MIHOMO_VERSION}

          WARNING:
            This firmware is ONLY for NX30 Pro
            using NMBM 112M UBI layout.
          EOF

          cd "${RELEASE}"

          sha256sum \
            *.bin \
            > sha256sums.txt

          echo
          echo "================================================"
          echo "最终固件"
          echo "================================================"

          ls -lah

          echo
          cat BUILD_INFO.txt

          echo
          cat sha256sums.txt

      # ============================================================
      # Upload
      # ============================================================

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: NX30Pro-112M-NMBM-ImmortalWrt24.10-OpenClash
          path: release_firmware/
          if-no-files-found: error
          retention-days: 30
